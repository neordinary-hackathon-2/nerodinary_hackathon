name: YouTube Collect

# 채널별 영상을 YouTube Data API 로 수집해 서버의 내부 동기화 API 로 보낸다.
# 설계: server/docs/decisions/0003-youtube-collector.md
#
# 필요한 GitHub 설정 (Settings → Secrets and variables → Actions)
#   Secrets  : YOUTUBE_API_KEY   (YouTube Data API 키. search.list 는 하루 100회까지)
#              SEED_TOKEN        (서버 내부 API 토큰. X-Seed-Token 헤더로 보낸다)
#   Variables: SYNC_API_BASE_URL (예: https://<서버 주소>/api)
#
# 매일 05:17 KST 에 예약 실행된다. 수동 실행은 dry_run 기본값이 true 다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 서버에 보내지 않고 수집 결과만 출력한다
        type: boolean
        default: true
      channel:
        description: 이 채널 번호(1~9)만 처리한다 (비우면 전체)
        type: string
        required: false
  # 매일 한 번 실제 동기화로 실행한다. (20:17 UTC = 05:17 KST)
  # 정각(:00)은 GitHub 예약 실행이 몰려 지연·누락되기 쉬워 분을 비켜 둔다. (11.22 05:00 실행 누락)
  #schedule:
  #  - cron: '17 20 * * *'

permissions:
  contents: read

concurrency:
  group: youtube-collect
  cancel-in-progress: false

defaults:
  run:
    working-directory: server

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SEED_TOKEN: ${{ secrets.SEED_TOKEN }}
          SYNC_API_BASE_URL: ${{ vars.SYNC_API_BASE_URL }}
          # 예약 실행에는 inputs 가 없으므로 실제 동기화로 동작한다.
          DRY_RUN: ${{ inputs.dry_run }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$CHANNEL" ]; then ARGS="$ARGS --channel=$CHANNEL"; fi
          pnpm collect:youtube $ARGS
