name: Server CI

on:
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - '.github/workflows/ci.yml'
  workflow_call:

defaults:
  run:
    working-directory: server

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # test/db-services.e2e-spec.ts 의 DB 통합 테스트용 1회용 MySQL.
      # 이 서비스가 없으면 해당 테스트는 경고를 남기고 건너뛴다.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Check migrations are up to date
        # 스키마를 바꾸고 pnpm db:generate 를 안 했으면 여기서 실패한다.
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::스키마 변경에 대한 마이그레이션이 없습니다. pnpm db:generate 후 drizzle/ 를 커밋하세요."
            exit 1
          fi
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USERNAME: root
          DB_PASSWORD: ''
